<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ludo Online - Real-Time Multiplayer</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app-container">
    <!-- Top Header -->
    <header id="game-header" class="game-header" style="display: none;">
      <div class="brand">
        <span>🎲</span>
        <span>LUDO KING</span>
      </div>
      <div class="header-controls">
        <button id="btn-toggle-mute" class="btn-icon" title="Toggle Sound">🔊</button>
        <button class="btn-icon" onclick="window.location.href='/'" title="Leave Game">🚪</button>
      </div>
    </header>

    <!-- 1. Lobby View -->
    <main id="lobby-view" class="glass-panel lobby-card">
      <div class="hero-banner">
        <h1>🎲 LUDO KING</h1>
        <p>Real-time multiplayer for 2–4 players. Play with friends or AI bots on any device!</p>
      </div>

      <div class="form-group">
        <label for="player-name-input" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; display: block;">YOUR NAME</label>
        <input type="text" id="player-name-input" class="input-text" placeholder="Enter your name" maxlength="16">
      </div>

      <button id="btn-create-room" class="btn-primary">
        <span>➕</span> Create New Room
      </button>

      <div class="divider">OR JOIN EXISTING ROOM</div>

      <div class="join-group">
        <input type="text" id="join-code-input" class="input-text" placeholder="Enter 4-letter room code (e.g. KING)" maxlength="4" style="text-transform: uppercase; text-align: center; font-size: 1.2rem; font-weight: 800; letter-spacing: 4px;">
        <button id="btn-join-room" class="btn-secondary" style="font-weight: 700; width: 100%;">
          🚀 Join Room
        </button>
      </div>
    </main>

    <!-- 2. Waiting Room View -->
    <section id="waiting-view" class="glass-panel" style="display: none; flex-direction: column;">
      <div class="room-code-badge">
        <span style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">ROOM CODE</span>
        <div id="waiting-room-code" class="code-display">----</div>
        <button id="btn-copy-invite" class="btn-icon" style="padding: 6px 16px; font-weight: 600; font-size: 0.85rem;">📋 Copy Invite Link</button>
      </div>

      <h3 style="font-size: 1rem; color: var(--text-muted); margin-bottom: 12px;">SEATS (2-4 PLAYERS)</h3>
      <div id="seats-container" class="seats-grid">
        <!-- Rendered dynamically -->
      </div>

      <button id="btn-start-game" class="btn-primary" style="margin-top: 8px;">
        <span>🚀</span> Start Game
      </button>
    </section>

    <!-- 3. Game Arena View -->
    <section id="arena-view" class="game-arena" style="display: none;">
      <!-- Turn & Timer Header -->
      <div class="turn-status-panel">
        <div class="turn-header">
          <div id="turn-player-badge" class="turn-player-badge">
            <span class="color-dot red"></span>
            <span>Red's Turn</span>
          </div>
          <span id="timer-seconds" style="font-weight: 800; font-size: 1.1rem; color: #FBBF24;">30s</span>
        </div>
        <div class="timer-bar-container">
          <div id="timer-progress-bar" class="timer-bar"></div>
        </div>
      </div>

      <!-- SVG Board -->
      <div class="board-wrapper" id="board-container">
        <!-- SVG rendered here -->
      </div>

      <!-- Action status & Dice Controls -->
      <div class="controls-bar">
        <div class="dice-container">
          <div id="dice-cube" class="dice-cube" title="Click to Roll">⚀</div>
          <div id="action-text" class="action-msg">Roll the dice to make your move!</div>
        </div>
        <div style="min-width: 130px;">
          <button id="btn-roll-dice" class="btn-primary" style="padding: 12px 16px;">
            🎲 Roll
          </button>
        </div>
      </div>

      <!-- Emoji Reactions Bar -->
      <div class="emoji-bar">
        <button class="emoji-btn" data-emoji="🔥">🔥</button>
        <button class="emoji-btn" data-emoji="😂">😂</button>
        <button class="emoji-btn" data-emoji="👏">👏</button>
        <button class="emoji-btn" data-emoji="😱">😱</button>
        <button class="emoji-btn" data-emoji="🎲">🎲</button>
        <button class="emoji-btn" data-emoji="👑">👑</button>
      </div>
    </section>

    <!-- 4. Winner Celebration Modal -->
    <div id="winner-modal" class="modal-overlay" style="display: none;">
      <div class="winner-card">
        <div class="winner-icon">🏆</div>
        <h2 class="winner-title">VICTORY!</h2>
        <p id="winner-name" style="font-size: 1.4rem; font-weight: 800; color: #F59E0B; margin-bottom: 8px;">Player 1</p>
        <p class="winner-desc">Brought all 4 tokens home and conquered the Ludo board!</p>
        <button id="btn-play-again" class="btn-primary">🎉 Play Again</button>
      </div>
    </div>
  </div>

  <script src="/audio.js"></script>
  <script src="/board.js"></script>
  <script src="/app.js"></script>
</body>
</html>
